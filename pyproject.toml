[project]
name = "10k-sentiment"
version = "0.1.0"
description = ""
authors = [
    {name = "Seymore",email = "seymorebuts67@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "lxml (>=6.1.0,<7.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "networkx (>=3.6.1,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "openai (>=2.32.0,<3.0.0)",
    "streamlit (>=1.56.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "10k_sentiment", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
